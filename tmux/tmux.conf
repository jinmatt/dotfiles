# --- GENERAL SETTINGS ---
unbind C-b
set -g prefix C-s
bind C-s send-prefix

set -g mouse on
set -g base-index 1          # Start windows at 1 for easier switching
set -g set-clipboard on      # Use system clipboard

# Stop programs and tmux from changing your window names
set-option -g allow-rename off
set-option -g automatic-rename off

# --- KEY BINDINGS ---
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# --- CATPPUCCIN CONFIG (v2.1.0+) ---
# 1. Configure the appearance (Must be before the plugin is loaded)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded" # This handles your   symbols automatically
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text " #W" # Shows window name

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text " #W" # Shows window name

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text " #{pane_current_path}"

# --- PLUGINS ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux' # Using the modern v2.1.0 version

# 2. Configure the status line (New v2 way)
# In v2, we manually set status-left and status-right using the plugin's variables
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Initialize TMUX plugin manager (KEEP THIS AT THE VERY BOTTOM)
run '~/.tmux/plugins/tpm/tpm'
